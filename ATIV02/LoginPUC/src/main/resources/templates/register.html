<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

<div class="register-container">

    <div class="logo-col">
        <div class="logo-wrapper">
            <img src="/images/logo.png" alt="Logo" class="logo-img">
        </div>
    </div>

    <div class="col-divider"></div>

    <div class="form-col">
        <h2 class="register-title">Crie sua conta</h2>
        <p class="register-subtitle">Preencha os dados abaixo para se cadastrar</p>

        <form th:action="@{/register}" method="post" class="register-form">
            
            <div class="form-grid">
                <div class="input-group full-width">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>
                
                <div class="input-group full-width">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="input-group full-width">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                </div>

                <div class="input-group full-width">
                    <label for="confirmaSenha">Confirmação de Senha</label>
                    <input type="password" id="confirmaSenha" name="confirmaSenha" placeholder="Confirme sua senha" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Registrar</button>
        </form>

        <div class="divider">ou</div>

        <p class="redirect-links">
            Já possui conta?
            <a href="/login">Faça login</a>
        </p>
    </div>

</div>

</body>
</html>
